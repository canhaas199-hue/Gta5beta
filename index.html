<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Grand Theft Auto - Web Edition</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b131f;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* GTA V Style HUD */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
        }
        .top-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        .money-box {
            font-size: 28px;
            font-weight: bold;
            color: #4cd137;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }
        .minimap-container {
            width: 180px; height: 180px;
            background: rgba(15, 19, 31, 0.85);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .minimap-player {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: #3498db;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .radar-blip {
            position: absolute;
            width: 6px; height: 6px;
            background: #e74c3c;
            border-radius: 50%;
        }

        /* Status Bars unten links */
        .status-bars {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 220px;
        }
        .bar-wrapper {
            background: rgba(0,0,0,0.6);
            padding: 3px;
            border-radius: 3px;
        }
        .bar-fill {
            height: 8px;
            width: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }
        #health-bar { background: #2ecc71; }
        #armor-bar { background: #3498db; width: 50%; }

        /* Zielkreuz */
        .crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            pointer-events: none;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        .crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        .crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        /* Interaktions-Hinweis */
        #notification {
            position: absolute;
            bottom: 25%; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            border-left: 5px solid #f1c40f;
            display: none;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Touch Controls für Mobile */
        #touch-controls {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: none;
        }
        .virtual-joystick {
            position: absolute;
            bottom: 40px; left: 40px;
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
        }
        .joystick-knob {
            position: absolute;
            top: 40px; left: 40px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        .touch-btn-group {
            position: absolute;
            bottom: 40px; right: 40px;
            display: grid;
            grid-template-columns: repeat(2, 75px);
            gap: 12px;
            pointer-events: auto;
        }
        .t-btn {
            width: 75px; height: 75px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .t-btn:active { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body>
    <div class="crosshair"></div>
    <div id="notification">Drücke [E] oder [Y], um einzusteigen</div>

    <div id="hud">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div class="status-bars">
                <div style="color: white; font-size: 12px; font-weight: bold;">GESUNDHEIT</div>
                <div class="bar-wrapper"><div id="health-bar" class="bar-fill"></div></div>
                <div style="color: white; font-size: 12px; font-weight: bold; margin-top: 4px;">RÜSTUNG</div>
                <div class="bar-wrapper"><div id="armor-bar" class="bar-fill"></div></div>
            </div>
            <div class="top-right">
                <div class="money-box">$ 124,580</div>
                <div class="minimap-container">
                    <div class="minimap-player"></div>
                    <div class="radar-blip" style="top: 30%; left: 70%;"></div>
                    <div class="radar-blip" style="top: 80%; left: 20%;"></div>
                    <div class="radar-blip" style="top: 40%; left: 30%;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="touch-controls">
        <div class="virtual-joystick" id="joy-zone">
            <div class="joystick-knob" id="joy-knob"></div>
        </div>
        <div class="touch-btn-group">
            <div class="t-btn" id="btn-action">AUTO</div>
            <div class="t-btn" id="btn-shoot">SCHUSS</div>
            <div class="t-btn" id="btn-jump">SPRUNG</div>
            <div class="t-btn" id="btn-sprint">SPRINT</div>
        </div>
    </div>

    <!-- Three.js Bibliothek -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. GRUNDSETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7fb3d5);
        scene.fog = new THREE.FogExp2(0x7fb3d5, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // Licht & Sonne
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(100, 150, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // --- 2. DIE STADT ERSTELLEN ---
        // Boden / Straßennetz
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Gebäude im Block-Stil mit Fenstern
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.3, metalness: 0.2 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x1a365d, roughness: 0.1, metalness: 0.9 });

        function createCityBlock(x, z, w, d, h) {
            const group = new THREE.Group();
            const geom = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geom, [buildingMat, buildingMat, glassMat, buildingMat, buildingMat, buildingMat]);
            mesh.position.y = h / 2;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        // Stadt-Layout generieren
        for (let x = -140; x <= 140; x += 60) {
            for (let z = -140; z <= 140; z += 60) {
                if (Math.abs(x) > 15 || Math.abs(z) > 15) {
                    createCityBlock(x, z, 45, 45, 30 + Math.random() * 50);
                }
            }
        }

        // --- 3. SPIELER & WAFFE ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Körper
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.5 });
        const playerBody = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.5, 0.4), bodyMat);
        playerBody.position.y = 0.75;
        playerBody.castShadow = true;
        playerGroup.add(playerBody);

        // Kopf
        const headMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
        const playerHead = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), headMat);
        playerHead.position.y = 1.65;
        playerGroup.add(playerHead);

        // Sichtbare Waffe in der Hand
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
        const weaponMesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.5), gunMat);
        weaponMesh.position.set(0.3, 0.85, -0.3);
        playerGroup.add(weaponMesh);

        playerGroup.position.set(0, 0, 10);

        // --- 4. FAHRZEUGE (GTA Sportwagen) ---
        const cars = [];
        let currentVehicle = null;

        function createSportCar(x, z, colorHex) {
            const carGroup = new THREE.Group();
            
            // Karosserie
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(2.1, 0.7, 4.4),
                new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.7, roughness: 0.2 })
            );
            body.position.y = 0.45;
            body.castShadow = true;
            carGroup.add(body);

            // Kabine / Dach
            const roof = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 0.55, 2.2),
                new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.1 })
            );
            roof.position.set(0, 1.0, -0.2);
            carGroup.add(roof);

            carGroup.position.set(x, 0, z);
            scene.add(carGroup);
            cars.push({ group: carGroup, speed: 0 });
        }

        createSportCar(15, -10, 0xe74c3c); // Roter Supersportwagen
        createSportCar(-20, 20, 0x3498db); // Blauer Wagen

        // --- 5. STEUERUNG (Tastatur, Maus, Controller, Touch) ---
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        let cameraAngle = 0;
        let pitch = 0.4;

        window.addEventListener('mousemove', e => {
            if (document.pointerLockElement === document.body) {
                cameraAngle -= e.movementX * 0.003;
                pitch = Math.max(0.1, Math.min(1.3, pitch - e.movementY * 0.003));
            }
        });

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        if ('ontouchstart' in window) {
            document.getElementById('touch-controls').style.display = 'block';
        }

        // Virtueller Joystick
        let touchX = 0, touchY = 0;
        const joyZone = document.getElementById('joy-zone');
        const joyKnob = document.getElementById('joy-knob');

        joyZone.addEventListener('touchmove', e => {
            const rect = joyZone.getBoundingClientRect();
            const touch = e.touches[0];
            let x = touch.clientX - (rect.left + rect.width / 2);
            let y = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.sqrt(x * x + y * y);
            if (dist > 45) { x = (x/dist)*45; y = (y/dist)*45; }
            joyKnob.style.transform = `translate(${x}px, ${y}px)`;
            touchX = x / 45; touchY = y / 45;
        });
        joyZone.addEventListener('touchend', () => {
            joyKnob.style.transform = `translate(0px, 0px)`;
            touchX = 0; touchY = 0;
        });

        // Ein- / Aussteigen Logik
        function toggleVehicle() {
            if (currentVehicle) {
                playerGroup.position.set(currentVehicle.group.position.x + 2, 0, currentVehicle.group.position.z);
                playerGroup.visible = true;
                currentVehicle = null;
                document.getElementById('notification').style.display = 'none';
            } else {
                cars.forEach(car => {
                    if (playerGroup.position.distanceTo(car.group.position) < 4.5) {
                        currentVehicle = car;
                        playerGroup.visible = false;
                        document.getElementById('notification').style.display = 'none';
                    }
                });
            }
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'KeyE') toggleVehicle();
        });
        document.getElementById('btn-action').addEventListener('click', toggleVehicle);

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Gamepad Abfrage (Xbox / Controller via Bluetooth oder Browser)
            const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;

            let moveX = 0, moveZ = 0;
            if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

            if (touchX !== 0 || touchY !== 0) { moveX = touchX; moveZ = touchY; }

            if (gp) {
                if (Math.abs(gp.axes[0]) > 0.15) moveX = gp.axes[0];
                if (Math.abs(gp.axes[1]) > 0.15) moveZ = gp.axes[1];
                if (Math.abs(gp.axes[2]) > 0.15) cameraAngle -= gp.axes[2] * 0.04;
                
                // Y-Taste (Xbox) / Triangle (PS) zum Einsteigen
                if (gp.buttons[3] && gp.buttons[3].pressed && !window.gpPressed) {
                    toggleVehicle();
                    window.gpPressed = true;
                    setTimeout(() => window.gpPressed = false, 400);
                }
            }

            // Fahrzeug- oder Fußgänger-Steuerung
            if (currentVehicle) {
                let throttle = -moveZ;
                let steer = moveX;
                currentVehicle.speed = THREE.MathUtils.lerp(currentVehicle.speed, throttle * 0.45, 0.1);
                currentVehicle.group.rotation.y -= steer * 0.035 * Math.sign(currentVehicle.speed || 0.01);
                currentVehicle.group.translateZ(currentVehicle.speed);

                // Kamera folgt Auto
                camera.position.x = currentVehicle.group.position.x - Math.sin(currentVehicle.group.rotation.y) * 9;
                camera.position.z = currentVehicle.group.position.z - Math.cos(currentVehicle.group.rotation.y) * 9;
                camera.position.y = currentVehicle.group.position.y + 4;
                camera.lookAt(currentVehicle.group.position.clone().add(new THREE.Vector3(0, 1, 0)));
            } else {
                const speed = keys['ShiftLeft'] ? 0.18 : 0.1;
                const fwd = new THREE.Vector3(-Math.sin(cameraAngle), 0, -Math.cos(cameraAngle));
                const side = new THREE.Vector3(-Math.cos(cameraAngle), 0, Math.sin(cameraAngle));
                
                const dir = new THREE.Vector3();
                dir.addScaledVector(fwd, -moveZ);
                dir.addScaledVector(side, moveX);
                dir.normalize();

                if (moveZ !== 0 || moveX !== 0) {
                    playerGroup.position.addScaledVector(dir, speed);
                    playerGroup.rotation.y = Math.atan2(dir.x, dir.z);
                }

                // Kamera folgt Spieler (Third-Person)
                camera.position.x = playerGroup.position.x + Math.sin(cameraAngle) * 5 * pitch;
                camera.position.z = playerGroup.position.z + Math.cos(cameraAngle) * 5 * pitch;
                camera.position.y = playerGroup.position.y + 1.8 + (pitch * 2.5);
                camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1, 0)));

                // Nähe zu Autos prüfen für Anzeige
                let nearCar = false;
                cars.forEach(car => {
                    if (playerGroup.position.distanceTo(car.group.position) < 4.5) nearCar = true;
                });
                document.getElementById('notification').style.display = nearCar ? 'block' : 'none';
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
